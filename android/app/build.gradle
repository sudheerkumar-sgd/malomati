plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// FCM: merge into Flutter's dart-defines so String.fromEnvironment works when you
// build/run from Android Studio or ./gradlew (no `flutter run --dart-define...`).
// Create android/fcm.local.properties from fcm.local.properties.example (gitignored).
def fcmLocalProps = new Properties()
def fcmLocalFile = rootProject.file('fcm.local.properties')
if (fcmLocalFile.exists()) {
    fcmLocalFile.withReader('UTF-8') { reader -> fcmLocalProps.load(reader) }
}
def fcmJsonB64FromGradle = fcmLocalProps.getProperty('fcm.service.account.json.base64')?.trim()
if (fcmJsonB64FromGradle) {
    def pair = 'FCM_SERVICE_ACCOUNT_JSON_BASE64=' + fcmJsonB64FromGradle
    def segment = java.util.Base64.getEncoder().encodeToString(pair.getBytes('UTF-8'))
    def existing = project.hasProperty('dart-defines') ? project.property('dart-defines').toString() : ''
    def merged = existing ? (existing + ',' + segment) : segment
    project.ext.set('dart-defines', merged)
}

android {
    namespace "com.gov.uaq.hrms"
    compileSdk  flutter.compileSdkVersion
    ndkVersion "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.gov.uaq.hrms"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 26
        targetSdkVersion flutter.targetSdkVersion
        versionCode 72
        versionName '3.0.19'
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "production, development"
    productFlavors {
        production {
            resValue "string", "app_name", "Malomati"
        }
        development {
            resValue "string", "app_name", "dev-malomati"
            //applicationIdSuffix ".ae.test"
            versionNameSuffix "-dev"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

