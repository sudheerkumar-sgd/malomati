# Keep heap modest — large -Xmx was starving native memory and killing the daemon (OOM).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1g
# AGP 8.11+ requires JDK 17+. Point to Android Studio's bundled JBR if system Java is older.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio2\\jbr
android.useAndroidX=true
# Jetifier is unnecessary with AndroidX-only deps and OOMs release builds (JetifyTransform).
android.enableJetifier=false
android.javaCompile.suppressSourceTargetDeprecationWarning=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
