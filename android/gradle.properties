# Keep heap modest — large -Xmx can starve native memory and kill the daemon (OOM).
# Reduced to avoid native allocation failures on constrained Windows environments.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1024m
# AGP 8.11+ requires JDK 17+. Point to Android Studio's bundled JBR if system Java is older.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio2\\jbr
android.useAndroidX=true
# Jetifier is unnecessary with AndroidX-only deps and OOMs release builds (JetifyTransform).
android.enableJetifier=false
android.javaCompile.suppressSourceTargetDeprecationWarning=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
